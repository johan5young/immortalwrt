name: Build ImmortalWrt NN6000 V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd
          sudo apt-get clean

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/*
          sudo apt-get autoremove -y
          sudo apt-get clean
          docker rmi $(docker images -q) 2>/dev/null || true
          df -h

      - name: Load Config
        run: |
          cp .config .config.bak 2>/dev/null || true
          make defconfig

      - name: Download Packages
        run: |
          make download -j2
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          # 关键：只用单核编译，避免 OOM
          make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-nn6000v2
          path: |
            bin/targets/qualcommax/ipq60xx/*.bin
            bin/targets/qualcommax/ipq60xx/*.itb
          retention-days: 7
