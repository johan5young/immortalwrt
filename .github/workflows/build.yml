name: Build ImmortalWrt NN6000 V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - johan5young-patch-1
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Initialize Environment
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
          file wget zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Configuration
        run: |
          cp .config .config.bak 2>/dev/null || true
          make defconfig

      - name: Download Packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-nn6000v2-${{ github.run_id }}
          path: |
            bin/targets/qualcommax/ipq60xx/*.bin
            bin/targets/qualcommax/ipq60xx/*.itb
            !bin/targets/qualcommax/ipq60xx/packages/
          retention-days: 7
