name: Build ImmortalWrt NN6000 V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - johan5young-patch-1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Initialize Environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
          file wget zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Update Feeds
        run: |
          # 添加重试机制，确保 feeds 更新成功
          for i in 1 2 3; do
            echo "Attempt $i/3: Updating feeds..."
            ./scripts/feeds update -a && break
            echo "Feeds update failed, waiting 30s before retry..."
            sleep 30
          done
          
          # 检查是否成功生成索引
          if [ ! -f "feeds/packages.index" ]; then
            echo "ERROR: feeds/packages.index not found, update failed"
            exit 1
          fi
          
          echo "Feeds updated successfully, installing..."
          ./scripts/feeds install -a

      - name: Free up disk space
        run: |
          echo "Cleaning up disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/pipx
          sudo rm -rf /usr/local/share/chrom* /usr/local/share/edge* /usr/local/share/firefox*
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/node
          sudo apt-get remove -y azure-cli google-cloud-cli mongodb-org || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          docker rmi $(docker images -q) 2>/dev/null || true
          df -h

      - name: Load Custom Configuration
        run: |
          cp .config .config.bak 2>/dev/null || true
          make defconfig

      - name: Download Packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-nn6000v2-${{ github.run_id }}
          path: |
            bin/targets/qualcommax/ipq60xx/*.bin
            bin/targets/qualcommax/ipq60xx/*.itb
            !bin/targets/qualcommax/ipq60xx/packages/
          retention-days: 7
