name: Build ImmortalWrt NN6000 V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - johan5young-patch-1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # 关键修正：增加磁盘空间清理（解决空间溢出）
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/pipx
          sudo rm -rf /usr/local/share/chrom* /usr/local/share/edge* /usr/local/share/firefox*
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/Java /opt/hostedtoolcache/PyPy
          sudo docker image prune -a -f
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Initialize Environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
          file wget zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Update Feeds
        run: |
          # 1. 强行删除可能导致语法错误的空行或非法字符
          sed -i '/^$/d' feeds.conf.default
          # 2. 修正文件结尾可能缺少的换行符
          echo "" >> feeds.conf.default
          # 3. 执行更新和安装
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Configuration
        run: |
          cp .config .config.bak 2>/dev/null || true
          make defconfig

      - name: Download Packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-nn6000v2-${{ github.run_id }}
          path: |
            bin/targets/qualcommax/ipq60xx/*.bin
            bin/targets/qualcommax/ipq60xx/*.itb
            !bin/targets/qualcommax/ipq60xx/packages/
          retention-days: 7
